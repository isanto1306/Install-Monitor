name: Publish Install Monitor beta image

on:
  push:
    branches: [main]
    paths:
      - main.py
      - requirements.txt
      - Dockerfile
      - docker-compose.yml
      - install.sh
      - 'tests/**'
      - RELEASE_NOTES.md
      - 'scripts/prepublish_check.py'
      - 'static/**'
      - '.github/workflows/publish-ghcr.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: install-monitor-ghcr-beta
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Verify application syntax
        run: |
          python3 -m py_compile main.py setup_credentials.py
          node --check static/app.js
      - name: Install test dependencies
        run: python3 -m pip install --disable-pip-version-check -r requirements.txt
      - name: Run offline regression tests
        run: python3 -m unittest discover -s tests -v
      - name: Check publication source
        run: python3 scripts/prepublish_check.py
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish beta image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/isanto1306/install-monitor:beta
            ghcr.io/isanto1306/install-monitor:0.2.60-beta.17
            ghcr.io/isanto1306/install-monitor:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/isanto1306/Install-Monitor
            org.opencontainers.image.title=Install Monitor
            org.opencontainers.image.version=0.2.60-beta.17
            org.opencontainers.image.licenses=GPL-3.0-only
          cache-from: type=gha
          cache-to: type=gha,mode=max
