name: Verify anonymous beta image pull

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-public-image.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  anonymous-pull:
    runs-on: ubuntu-latest
    steps:
      - name: Pull as an anonymous user
        run: |
          set -eu
          docker logout ghcr.io >/dev/null 2>&1 || true
          docker pull ghcr.io/isanto1306/install-monitor:beta
          docker pull ghcr.io/isanto1306/install-monitor:0.2.56-beta.3
      - name: Inspect published image
        run: |
          beta=$(docker image inspect ghcr.io/isanto1306/install-monitor:beta --format '{{.Id}}')
          release=$(docker image inspect ghcr.io/isanto1306/install-monitor:0.2.56-beta.3 --format '{{.Id}}')
          echo "Beta image and Beta 2 immutable tag"
          test "$beta" = "$release"
          docker image inspect ghcr.io/isanto1306/install-monitor:0.2.56-beta.3 --format '{{index .Config.Labels "org.opencontainers.image.version"}}' | grep -Fx '0.2.56-beta.3'
