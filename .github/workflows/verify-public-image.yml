name: Verify anonymous beta image pull

on:
  workflow_run:
    workflows: ["Publish Install Monitor beta image"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  anonymous-pull:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Pull as an anonymous user
        run: |
          set -eu
          docker logout ghcr.io >/dev/null 2>&1 || true
          docker pull ghcr.io/isanto1306/install-monitor:beta
          docker pull ghcr.io/isanto1306/install-monitor:0.2.63-beta.20
      - name: Verify beta and release image match
        run: |
          set -eu
          beta=$(docker image inspect ghcr.io/isanto1306/install-monitor:beta --format '{{.Id}}')
          release=$(docker image inspect ghcr.io/isanto1306/install-monitor:0.2.63-beta.20 --format '{{.Id}}')
          test "$beta" = "$release"
          docker image inspect ghcr.io/isanto1306/install-monitor:0.2.63-beta.20 \
            --format '{{index .Config.Labels "org.opencontainers.image.version"}}' \
            | grep -Fx '0.2.63-beta.20'
